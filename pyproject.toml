[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extrator-notas"
version = "0.1.0"
description = "API FastAPI com agente de tool calling que extrai dados de notas fiscais e faturas (OCR) e grava em PostgreSQL."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
